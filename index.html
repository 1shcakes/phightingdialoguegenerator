<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phighting Dialogue Generator</title>
</head>
<body>
  <textarea id="typeInput" placeholder="start typing here…" rows="8" cols="50" autofocus></textarea>
  <br>
  <select id="voiceSelect">
    <option value="https://static.wikitide.net/phightingwiki/f/f4/SwordDialogue.mp3" selected>Sword</option>
    <option value="https://static.wikitide.net/phightingwiki/e/ee/SkateboardDialogue.mp3">Skateboard</option>
    <option value="https://static.wikitide.net/phightingwiki/5/5f/BiograftDialogue.mp3">Biograft</option>
    <option value="https://static.wikitide.net/phightingwiki/3/3a/KatanaDialogue.mp3">Katana</option>
    <option value="https://static.wikitide.net/phightingwiki/b/b7/SFX_Ban_Hammer_Dialogue.mp3">Ban Hammer</option>
    <option value="https://static.wikitide.net/phightingwiki/9/9e/RocketDialogue.mp3">Rocket</option>
    <option value="https://static.wikitide.net/phightingwiki/c/c3/SlingshotDialogue.mp3">Slingshot</option>
    <option value="https://static.wikitide.net/phightingwiki/d/dd/HyperlaserDialogueNew.ogg">Hyperlaser (GLITCHY)</option>
    <option value="https://static.wikitide.net/phightingwiki/8/8d/ShurikenDialogue.mp3">Shuriken</option>
    <option value="https://static.wikitide.net/phightingwiki/8/8f/SFX_Scythe_Dialogue.mp3">Scythe</option>
    <option value="https://static.wikitide.net/phightingwiki/4/4e/MedkitDialogue.mp3">Medkit</option>
    <option value="https://static.wikitide.net/phightingwiki/e/eb/BoomboxDialogue.mp3">Boombox</option>
    <option value="https://static.wikitide.net/phightingwiki/c/c6/SubspaceDialogue.mp3">Subspace</option>
    <option value="https://static.wikitide.net/phightingwiki/4/42/SFX_Vine_Staff_Dialogue.mp3">Vine Staff</option>
    <option value="https://static.wikitide.net/phightingwiki/7/7b/SFX_Coil_Dialogue.mp3">Coil</option>
  </select>
  <br>
  <label for="speedSlider">Speed Delay (ms): </label>
  <input type="range" id="speedSlider" min="20" max="300" value="70">
  <span id="speedVal">70ms</span>
  <br>
  <button id="playBtn">Auto Play</button>
  <br>
  <div id="outputDisplay"></div>
  <br>
  <span id="statusMsg">ready</span>

<script>
  (function() {
    // ============================================================
    // pitch rules
    // ============================================================
    const PITCH_MIN = 0.5;
    const PITCH_MAX = 1.8;
    const VOLUME_MIN = 0.35;
    const VOLUME_MAX = 0.7;
    // ============================================================

    const typeInput = document.getElementById('typeInput');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedSlider = document.getElementById('speedSlider');
    const speedVal = document.getElementById('speedVal');
    const playBtn = document.getElementById('playBtn');
    const outputDisplay = document.getElementById('outputDisplay');
    const statusMsg = document.getElementById('statusMsg');

    let audioCtx = null;
    let audioBuffer = null;
    let loadedVoiceUrl = null;
    let isPlaying = false;
    let playTimeoutId = null;

    speedSlider.addEventListener('input', () => {
      speedVal.textContent = speedSlider.value + 'ms';
    });

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    async function unlockAudio() {
      const ctx = getAudioContext();
      if (ctx.state === 'suspended') {
        try { await ctx.resume(); } catch (e) {}
      }
    }

    async function loadVoice(url) {
      if (!url) {
        audioBuffer = null;
        loadedVoiceUrl = null;
        statusMsg.textContent = 'voice not available. :C';
        return;
      }
      if (loadedVoiceUrl === url && audioBuffer) return;

      statusMsg.textContent = 'loading!!!';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const arrayBuffer = await res.arrayBuffer();
        const ctx = getAudioContext();
        audioBuffer = await ctx.decodeAudioData(arrayBuffer);
        loadedVoiceUrl = url;
        statusMsg.textContent = 'ready! :D';
      } catch (e) {
        console.warn('Load failed:', e);
        audioBuffer = null;
        loadedVoiceUrl = null;
        statusMsg.textContent = 'ERROR! pls check the url!';
      }
    }

    loadVoice(voiceSelect.value);

    voiceSelect.addEventListener('change', () => {
      loadVoice(voiceSelect.value);
    });

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function playSound() {
      if (!audioBuffer) return;

      const ctx = getAudioContext();
      if (ctx.state !== 'running') {
        ctx.resume().catch(() => {});
      }

      const source = ctx.createBufferSource();
      source.buffer = audioBuffer;

      const pitch = randomBetween(PITCH_MIN, PITCH_MAX);
      source.playbackRate.value = pitch;

      const vol = randomBetween(VOLUME_MIN, VOLUME_MAX);
      const gain = ctx.createGain();
      gain.gain.value = vol;

      source.connect(gain);
      gain.connect(ctx.destination);

      const offset = Math.random() * 0.05;
      source.start(0, offset, 0.15);

      source.onended = () => {
        source.disconnect();
        gain.disconnect();
      };
    }

    // Manual typing
    let lastLength = 0;

    typeInput.addEventListener('input', () => {
      const newLength = typeInput.value.length;

      if (newLength > lastLength) {
        playSound();
      }

      lastLength = newLength;
    });

    // Auto Play typewriter logic
    playBtn.addEventListener('click', async () => {
      await unlockAudio();

      if (isPlaying) {
        // Stop current playback
        isPlaying = false;
        clearTimeout(playTimeoutId);
        playBtn.textContent = 'Auto Play';
        return;
      }

      const text = typeInput.value;
      if (!text) return;

      isPlaying = true;
      playBtn.textContent = 'Stop';
      outputDisplay.textContent = '';

      let index = 0;
      const baseDelay = parseInt(speedSlider.value, 10);

      function typeNextChar() {
        if (!isPlaying || index >= text.length) {
          isPlaying = false;
          playBtn.textContent = 'Auto Play';
          return;
        }

        const currentChar = text[index];
        outputDisplay.textContent += currentChar;
        playSound();

        // pauses
        let delayMultiplier = 1;

        if (currentChar === ',' || currentChar === ';' || currentChar === ':') {
          delayMultiplier = 3.5;
        } else if (currentChar === '.' || currentChar === '!' || currentChar === '?') {
          const isEllipsis = text.slice(index, index + 3) === '...' || 
                             (index >= 1 && text.slice(index - 1, index + 2) === '...') ||
                             (index >= 2 && text.slice(index - 2, index + 1) === '...');
          
          if (isEllipsis) {
            delayMultiplier = 3.0;
          } else {
            delayMultiplier = 5.0;
          }
        }

        index++;
        playTimeoutId = setTimeout(typeNextChar, baseDelay * delayMultiplier);
      }

      typeNextChar();
    });

    typeInput.addEventListener('focus', unlockAudio, { once: true });
    typeInput.addEventListener('touchstart', unlockAudio, { once: true });
    document.body.addEventListener('click', unlockAudio, { once: true });

  })();
</script>
</body>
</html>
